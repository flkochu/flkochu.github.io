<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTÓN virtual</title>
<meta name="description" content="Modelo 3D interactivo de PROTÓN / Plague Bot VR: brazo de 6 GDL con las piezas CAD reales y chasis manejable.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Tektur:wdth,wght@75..100,400..900&display=swap">
<style>
:root{color-scheme:dark;--film:#07050F;--sheet:#100B20;--sheet-2:#171030;--ink:#EFE9FF;--ink-2:#A99FCC;--rule:#3A2E66;--rule-2:#1F1840;--line:#5B4AA6;
  --cyan:#2DE2F0;--magenta:#FF3B8D;--yellow:#F5E642;--violet:#A47BFF;--blue:var(--cyan);
  --f:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;--f-d:"Tektur","Archivo","Arial Narrow",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background-color:var(--film);background-image:radial-gradient(900px 520px at 0% 0%,rgba(255,59,141,.10),transparent 70%);color:var(--ink);font-family:var(--f);line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 36px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-family:var(--f-d);font-size:clamp(1.5rem,3vw,2.2rem);font-weight:650;line-height:1.1;letter-spacing:-.01em;text-shadow:0 0 30px rgba(164,123,255,.3)}
p{margin:0;max-width:70ch;color:var(--ink-2)}
a{color:inherit;text-decoration-color:var(--cyan);text-underline-offset:3px}
a:hover{color:var(--cyan)}
.lang{display:inline-flex;border:1px solid var(--rule)}
.lang button{border:0;background:transparent;color:inherit;padding:3px 10px;font:inherit;font-weight:600;font-size:.8rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cyan);color:var(--sheet)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="t">PROTÓN virtual</h1>
      <p id="d">Brazo de 6 GDL con las piezas CAD reales y chasis aproximado a partir de fotos. Mueve cada articulación, prueba las poses y maneja el robot.</p>
    </div>
    <div style="display:flex;gap:14px;align-items:center">
      <a id="back" href="../">Volver al portafolio</a>
      <span class="lang" role="group" aria-label="Idioma / Language"><button type="button" id="es" aria-pressed="true">ES</button><button type="button" id="en" aria-pressed="false">EN</button></span>
    </div>
  </header>
  <div id="sim"></div>
</div>
<script type="module">
import { mountProton } from "./sim.js";
const TX = {
  es: { t: "PROTÓN virtual", d: "Brazo de 6 GDL con las piezas CAD reales y chasis aproximado a partir de fotos. Mueve cada articulación, prueba las poses y maneja el robot.", back: "Volver al portafolio" },
  en: { t: "Virtual PROTÓN", d: "6-DOF arm built from the real CAD parts and a chassis approximated from photos. Move each joint, try the poses and drive the robot.", back: "Back to portfolio" },
};
let lang = "es";
try { lang = localStorage.getItem("all-lang") || ((navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en"); } catch (e) {}
const sim = await mountProton(document.getElementById("sim"), { glb: "proton_arm.glb", poster: "poster-dark.jpg", lang });
function setLang(l) {
  lang = l; document.documentElement.lang = l;
  for (const k of ["t", "d", "back"]) document.getElementById(k).textContent = TX[l][k];
  document.getElementById("es").setAttribute("aria-pressed", l === "es"); document.getElementById("en").setAttribute("aria-pressed", l === "en");
  sim.setLang(l); try { localStorage.setItem("all-lang", l); } catch (e) {}
}
document.getElementById("es").onclick = () => setLang("es");
document.getElementById("en").onclick = () => setLang("en");
setLang(lang);
window.__sim = sim;
</script>
</body>
</html>
